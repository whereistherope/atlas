<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Native Refinement Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080b0e;color:#d9e0e5;font-family:Inter,system-ui,-apple-system,sans-serif}body{display:grid;grid-template-rows:44px minmax(0,1fr);overflow:hidden}.bar{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #29323a;background:#0d1115;font-size:11px}.title{font-weight:700;margin-right:auto}.tag{font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:#7f8e9a}.bar button{border:1px solid #34414b;background:#111820;color:#aeb9c2;border-radius:4px;padding:6px 9px;font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}.bar button.active{border-color:#6f8da0;background:#1a2832;color:#e6eef3}.bar button:hover{color:#fff}.note{color:#788690;font:600 8px ui-monospace,SFMono-Regular,Menlo,monospace;margin-left:5px}iframe{width:100%;height:100%;border:0;background:#090b0d}@media(max-width:700px){.tag,.note{display:none}.bar{gap:5px;padding:0 6px}.bar button{padding:6px 7px}}
</style>
</head>
<body>
<div class="bar">
  <span class="title">Atlas · Native Refinement r12</span><span class="tag">preview only</span>
  <button id="refined" class="active">Refined</button><button id="current">Current</button>
  <button id="night" class="active">Night</button><button id="day">Day</button>
  <span class="note">Unified boundless system · no settings saved</span>
</div>
<iframe id="atlas" src="../../index.html" title="Atlas refinement preview"></iframe>
<script>
const frame=document.getElementById('atlas');
const refinedBtn=document.getElementById('refined'),currentBtn=document.getElementById('current');
const nightBtn=document.getElementById('night'),dayBtn=document.getElementById('day');
let refined=true,mode='night',bootPoll=null,themeGuard=null;
function setPreviewTheme(doc){if(!doc?.body)return;if(mode==='night')doc.body.dataset.theme='night';else delete doc.body.dataset.theme}
function ensureAssets(doc){
  const defs=[
    ['atlas-native-refinement-preview','./prototypes/native-refinement/theme-system.css?v=12'],
    ['atlas-native-refinement-r10','./prototypes/native-refinement/theme-r10.css?v=12'],
    ['atlas-native-refinement-r11','./prototypes/native-refinement/theme-r11.css?v=12'],
    ['atlas-native-refinement-r12','./prototypes/native-refinement/theme-r12.css?v=12']
  ];
  const links=defs.map(([id,href])=>{let link=doc.getElementById(id);if(!link){link=doc.createElement('link');link.id=id;link.rel='stylesheet';link.href=href;doc.head.appendChild(link)}return link});
  links.forEach(link=>doc.head.appendChild(link));
  let script=doc.getElementById('atlas-window-drag-preview');if(!script){script=doc.createElement('script');script.id='atlas-window-drag-preview';script.src='./prototypes/native-refinement/window-drag.js?v=12';doc.body.appendChild(script)}
  return links;
}
function apply(){const doc=frame.contentDocument;if(!doc?.body)return;const links=ensureAssets(doc);links.forEach(link=>link.disabled=!refined);setPreviewTheme(doc);const terrain=doc.querySelector('.atlas-lock-terrain');if(refined&&terrain)terrain.style.display='none';else if(terrain)terrain.style.removeProperty('display');refinedBtn.classList.toggle('active',refined);currentBtn.classList.toggle('active',!refined);nightBtn.classList.toggle('active',mode==='night');dayBtn.classList.toggle('active',mode==='day')}
function startPreview(){const doc=frame.contentDocument;if(!doc?.body)return;clearInterval(bootPoll);clearInterval(themeGuard);apply();themeGuard=setInterval(()=>{if(!refined)return;const wrong=(mode==='night'&&doc.body.dataset.theme!=='night')||(mode==='day'&&doc.body.dataset.theme==='night');if(wrong)setPreviewTheme(doc)},500)}
frame.addEventListener('load',()=>{const doc=frame.contentDocument;let tries=0;bootPoll=setInterval(()=>{tries++;if(doc?.documentElement?.classList.contains('atlas-ready')||tries>60)startPreview()},100)});
refinedBtn.onclick=()=>{refined=true;startPreview()};currentBtn.onclick=()=>{refined=false;apply()};nightBtn.onclick=()=>{mode='night';apply()};dayBtn.onclick=()=>{mode='day';apply()};
</script>
</body>
</html>
