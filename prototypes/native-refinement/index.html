<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Native Refinement Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080b0e;color:#d9e0e5;font-family:Inter,system-ui,-apple-system,sans-serif}body{display:grid;grid-template-rows:44px minmax(0,1fr);overflow:hidden}.bar{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #29323a;background:#0d1115;font-size:11px}.title{font-weight:700;margin-right:auto}.tag{font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:#7f8e9a}.bar button{border:1px solid #34414b;background:#111820;color:#aeb9c2;border-radius:4px;padding:6px 9px;font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}.bar button.active{border-color:#6f8da0;background:#1a2832;color:#e6eef3}.bar button:hover{color:#fff}.note{color:#788690;font:600 8px ui-monospace,SFMono-Regular,Menlo,monospace;margin-left:5px}iframe{width:100%;height:100%;border:0;background:#090b0d}@media(max-width:700px){.tag,.note{display:none}.bar{gap:5px;padding:0 6px}.bar button{padding:6px 7px}}
</style>
</head>
<body>
<div class="bar">
  <span class="title">Atlas · Native Refinement r9</span><span class="tag">preview only</span>
  <button id="refined" class="active">Refined</button><button id="current">Current</button>
  <button id="night" class="active">Night</button><button id="day">Day</button>
  <span class="note">Authoritative preview mode · no settings saved</span>
</div>
<iframe id="atlas" src="../../index.html" title="Atlas refinement preview"></iframe>
<script>
const frame=document.getElementById('atlas');
const refinedBtn=document.getElementById('refined'),currentBtn=document.getElementById('current');
const nightBtn=document.getElementById('night'),dayBtn=document.getElementById('day');
let refined=true,mode='night',themeObserver=null,bootPoll=null;

function setPreviewTheme(doc){
  const body=doc.body,html=doc.documentElement;if(!body||!html)return;
  html.dataset.atlasPreviewTheme=mode;
  body.dataset.atlasPreviewTheme=mode;
  if(mode==='night')body.dataset.theme='night';else delete body.dataset.theme;
}

function ensureAssets(doc){
  let link=doc.getElementById('atlas-native-refinement-preview');
  if(!link){link=doc.createElement('link');link.id='atlas-native-refinement-preview';link.rel='stylesheet';link.href='./prototypes/native-refinement/theme-system.css?v=9';doc.head.appendChild(link)}
  // Keep the preview override last even when Atlas appends late-loaded styles.
  if(link.parentNode===doc.head&&doc.head.lastElementChild!==link)doc.head.appendChild(link);
  let script=doc.getElementById('atlas-window-drag-preview');
  if(!script){script=doc.createElement('script');script.id='atlas-window-drag-preview';script.src='./prototypes/native-refinement/window-drag.js?v=9';doc.body.appendChild(script)}
  return link;
}

function apply(){
  const doc=frame.contentDocument;if(!doc?.body)return;
  const link=ensureAssets(doc);link.disabled=!refined;
  setPreviewTheme(doc);
  const terrain=doc.querySelector('.atlas-lock-terrain');if(refined&&terrain)terrain.style.display='none';else if(terrain)terrain.style.removeProperty('display');
  refinedBtn.classList.toggle('active',refined);currentBtn.classList.toggle('active',!refined);nightBtn.classList.toggle('active',mode==='night');dayBtn.classList.toggle('active',mode==='day');
}

function startAuthoritativePreview(){
  const doc=frame.contentDocument;if(!doc?.body)return;
  clearInterval(bootPoll);
  apply();
  themeObserver?.disconnect();
  themeObserver=new MutationObserver(()=>{
    if(!refined)return;
    const body=doc.body;
    const wrong=(mode==='night'&&body.dataset.theme!=='night')||(mode==='day'&&body.dataset.theme==='night');
    if(wrong)setPreviewTheme(doc);
    const link=doc.getElementById('atlas-native-refinement-preview');
    if(link&&doc.head.lastElementChild!==link)doc.head.appendChild(link);
  });
  themeObserver.observe(doc.documentElement,{attributes:true,subtree:true,childList:true,attributeFilter:['data-theme','class']});
  themeObserver.observe(doc.head,{childList:true});
}

frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  let tries=0;
  bootPoll=setInterval(()=>{
    tries++;
    if(doc?.documentElement?.classList.contains('atlas-ready')||tries>60)startAuthoritativePreview();
  },100);
});
refinedBtn.onclick=()=>{refined=true;startAuthoritativePreview()};
currentBtn.onclick=()=>{refined=false;apply()};
nightBtn.onclick=()=>{mode='night';apply()};
dayBtn.onclick=()=>{mode='day';apply()};
</script>
</body>
</html>
