name: Atlas Smoke Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: node tests/js_syntax_smoke.js

      - name: Current Atlas smoke contracts
        run: python tests/v0140_smoke_test.py

      - name: Persisted workspace compatibility
        run: python tests/v0122_static_test.py

      - name: Cloud and relay Node runtime tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/cloud*_test.js tests/relay*_test.js; do
            [ -f "$test" ] || continue
            echo "==> $test"
            node "$test"
          done

      - name: Network Node runtime tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/v015*_test.js; do
            [ -f "$test" ] || continue
            echo "==> $test"
            node "$test"
          done

      - name: Preserved lock contract
        run: node tests/v0167_lock_terrain_test.js

      - name: Stable recovery contract
        run: node tests/v0169_stable_recovery_test.js
