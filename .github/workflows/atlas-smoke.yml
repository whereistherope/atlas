name: Atlas Smoke Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: node tests/js_syntax_smoke.js

      - name: Current Atlas smoke contracts
        run: python tests/v0140_smoke_test.py

      - name: Persisted workspace compatibility
        run: python tests/v0122_static_test.py

      - name: Existing Node runtime tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*_test.js; do
            case "$test" in
              tests/js_syntax_smoke.js|tests/browser_boot_smoke.js|tests/upcoming_scroll_house_buttons_browser_test.js|tests/house_list_todo_scroll_browser_test.js) continue ;;
            esac
            echo "==> $test"
            node "$test"
          done

      - name: Install browser smoke dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Real browser boot smoke
        run: node tests/browser_boot_smoke.js

      - name: Upcoming and House button browser regression
        run: node tests/upcoming_scroll_house_buttons_browser_test.js

      - name: House List and To-do scroll regression
        run: node tests/house_list_todo_scroll_browser_test.js
