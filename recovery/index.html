<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atlas Recovery</title><style>:root{color-scheme:dark;--bg:#080a0c;--surface:#111519;--line:#303941;--ink:#e5e4e2;--muted:#8b9294;--accent:#7894a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:920px;margin:auto;padding:28px 18px 60px}h1{font-size:18px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}p{color:var(--muted);font:13px/1.55 system-ui,sans-serif}.warn{border:1px solid #5d4930;padding:12px;background:#18130d;color:#d9be90}.status{margin:16px 0;padding:10px 12px;border:1px solid var(--line);background:var(--surface);font-size:12px}.grid{display:grid;gap:10px}.card{border:1px solid var(--line);padding:12px;background:#0d1114}.card strong{display:block;font-size:12px;margin-bottom:6px}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;font-size:11px;color:var(--muted)}button{margin-top:10px;border:1px solid #425665;background:transparent;color:var(--ink);padding:8px 10px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}button:hover{background:#111a20}.good{color:#8bc99b}.bad{color:#db9b9b}code{color:#a7c3d3}</style></head><body><main><h1>Atlas Local Recovery</h1><p class="warn"><strong>Read-only inspection.</strong> This page does not load Atlas, does not start cloud sync, and does not write to IndexedDB. Keep the normal Atlas app closed while checking this.</p><div id="status" class="status">Opening local Atlas storage…</div><section><h2>Safety backups</h2><div id="backups" class="grid"></div></section><section><h2>Current local state</h2><div id="current" class="grid"></div></section></main><script>
const DB_NAME='atlas_personal_os',DB_VERSION=3,BACKUP_STORE='backups',STATE_STORE='state',STATE_KEY='atlas-v1';
const status=document.getElementById('status'),backupsEl=document.getElementById('backups'),currentEl=document.getElementById('current');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stateLike(v){if(!v||typeof v!=='object')return null;if(Array.isArray(v.notes)&&Array.isArray(v.projects)&&Array.isArray(v.areas))return v;for(const k of ['state','snapshot','data','value','payload']){const x=v[k];if(x&&typeof x==='object'&&Array.isArray(x.notes)&&Array.isArray(x.projects)&&Array.isArray(x.areas))return x}return null}
function timeOf(v,key){for(const x of [v?.time,v?.createdAt,v?.savedAt,v?.timestamp,v?.date,stateLike(v)?.meta?.lastSavedAt,key]){const n=Number(x);if(Number.isFinite(n)&&n>1e11)return n;const d=Date.parse(x);if(Number.isFinite(d))return d}return 0}
function reasonOf(v,key){return v?.reason||v?.label||v?.name||v?.description||String(key||'backup')}
function summary(st){if(!st)return null;return{notes:st.notes?.length||0,projects:st.projects?.length||0,daily:st.daily?.length||0,calendar:st.calendar?.length||0,todos:st.quickTodos?.length||0,areas:st.areas?.length||0,lastSaved:st.meta?.lastSavedAt||0}}
function fmt(t){return t?new Date(t).toLocaleString('en-AU'):'Unknown'}
function card(key,v,kind){const st=stateLike(v),s=summary(st),t=timeOf(v,key);const el=document.createElement('article');el.className='card';el.innerHTML=`<strong>${esc(reasonOf(v,key))}</strong><div class="meta"><span>Key: ${esc(key)}</span><span>Time: ${esc(fmt(t))}</span>${s?`<span>Notes: ${s.notes}</span><span>Projects: ${s.projects}</span><span>Daily: ${s.daily}</span><span>Calendar: ${s.calendar}</span><span>To-dos: ${s.todos}</span><span>Areas: ${s.areas}</span>`:'<span class="bad">State payload not recognised</span>'}</div>`;if(st){const b=document.createElement('button');b.textContent='Download this snapshot JSON';b.onclick=()=>{const blob=new Blob([JSON.stringify(st,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`atlas-${kind}-${t||Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el.appendChild(b)}return{el,t,s}}
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onupgradeneeded=()=>{req.transaction.abort();reject(new Error('Atlas database is not present on this browser.'))}})}
function readAll(db,store){return new Promise((resolve,reject)=>{if(!db.objectStoreNames.contains(store))return resolve([]);const tx=db.transaction(store,'readonly'),os=tx.objectStore(store),out=[];const req=os.openCursor();req.onsuccess=()=>{const c=req.result;if(!c)return resolve(out);out.push([c.key,c.value]);c.continue()};req.onerror=()=>reject(req.error)})}
function readOne(db,store,key){return new Promise((resolve,reject)=>{if(!db.objectStoreNames.contains(store))return resolve(null);const tx=db.transaction(store,'readonly'),r=tx.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
(async()=>{try{const db=await openDb();const rows=await readAll(db,BACKUP_STORE);const parsed=rows.map(([k,v])=>({k,v,...card(k,v,'backup')})).sort((a,b)=>b.t-a.t);backupsEl.innerHTML='';for(const x of parsed)backupsEl.appendChild(x.el);if(!parsed.length)backupsEl.innerHTML='<div class="card bad">No local safety backups found in this browser profile.</div>';const cur=await readOne(db,STATE_STORE,STATE_KEY);currentEl.innerHTML='';if(cur)currentEl.appendChild(card(STATE_KEY,cur,'current').el);else currentEl.innerHTML='<div class="card bad">Current Atlas state not found.</div>';const syncBackups=parsed.filter(x=>/Sync v2 remote apply/i.test(reasonOf(x.v,x.k)));status.innerHTML=`<span class="good">Storage opened safely.</span> Found <strong>${parsed.length}</strong> backup(s)${syncBackups.length?`, including <strong>${syncBackups.length}</strong> pre-sync safety backup(s).`:'.'}`;db.close()}catch(e){status.innerHTML=`<span class="bad">Could not inspect local Atlas storage:</span> ${esc(e.message||e)}`}})();
</script></body></html>
