<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#05080c" />
<meta name="application-name" content="Atlas" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
:root{
  --bg:#dfdfd6;--paper:#efeee6;--paper2:#e7e6dd;--ink:#1d241f;--muted:#697169;--line:#9da39a;
  --green:#344b3a;--green2:#566b59;--sand:#b4a787;--amber:#a36f2c;--red:#82483f;--blue:#53656c;
  --shadow:0 10px 28px rgba(29,36,31,.08)
}
body[data-theme="night"]{
  --bg:#070b10;--paper:#0c1219;--paper2:#101821;--ink:#d9edf8;--muted:#7892a3;--line:#253746;
  --green:#1793d1;--green2:#33a9e6;--sand:#6f8797;--amber:#d7a84a;--red:#d46d67;--blue:#1793d1;
  --shadow:0 12px 34px rgba(0,0,0,.34)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#d8dad2 0,#e8e7df 100%);transition:background .2s,color .2s}
body[data-theme="night"]{background:radial-gradient(circle at 50% -10%,rgba(23,147,209,.10),transparent 34%),linear-gradient(180deg,#05080c 0,#080d12 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(29,36,31,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(29,36,31,.07) 1px,transparent 1px);background-size:24px 24px}
body[data-theme="night"]:before{opacity:.22;background-image:linear-gradient(rgba(23,147,209,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(23,147,209,.055) 1px,transparent 1px)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:.055em}
.shell{max-width:1660px;margin:0 auto;padding:18px 22px 34px;position:relative;z-index:1}
.topbar{border-top:4px solid var(--green);border-bottom:1px solid var(--line);padding:8px 0 7px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.brand-home{border:0;background:transparent;color:var(--ink);padding:0;margin:0;font-size:clamp(28px,3vw,36px);font-weight:780;line-height:1;letter-spacing:-.045em;text-align:left;flex:0 0 auto}
.brand-home:hover{color:var(--green)}
.actions,.tabs,.subtabs,.space-switch,.section-switch,.inline-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.utility-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px;flex-wrap:wrap;min-width:0}
.utility-btn,.utility-file{border:0;background:transparent;color:var(--ink);opacity:.62;padding:7px 8px;border-radius:3px;font:800 9.5px/1 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;letter-spacing:.05em;transition:.14s}
.utility-btn:hover,.utility-file:hover{color:var(--green);background:rgba(52,75,58,.07);opacity:1}
.utility-accent{color:var(--green);opacity:.92}
body[data-theme="night"] .utility-btn:hover,body[data-theme="night"] .utility-file:hover{background:rgba(23,147,209,.08)}
.btn,.tab,.file-label{border:1px solid var(--muted);background:transparent;color:var(--ink);border-radius:4px;padding:9px 11px;font:800 10px/1 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;letter-spacing:.055em;transition:.14s}
.btn:hover,.tab:hover,.file-label:hover{background:var(--ink);color:var(--paper)}
body[data-theme="night"] .btn:hover,body[data-theme="night"] .tab:hover,body[data-theme="night"] .file-label:hover{background:var(--green);color:#031018;border-color:var(--green)}
.btn.primary,.tab.active{background:var(--green);border-color:var(--green);color:#f3f1e8}
body[data-theme="night"] .btn.primary,body[data-theme="night"] .tab.active{color:#031018}
.btn.ghost{border-color:#9aa096;color:var(--muted)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{padding:7px 8px;font-size:9px}
input[type=file]{display:none}
.navline{display:flex;justify-content:flex-end;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.tabs{gap:4px}
.tab{border-color:transparent;padding:8px 10px}
.nav-switches{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.header-switch{display:flex;align-items:center;gap:5px;margin-left:3px;font:800 8px/1 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--muted);white-space:nowrap}.header-switch select{border:1px solid color-mix(in srgb,var(--line) 78%,transparent);background:transparent;border-radius:4px;padding:6px 25px 6px 7px;color:var(--ink);font:800 9px "SFMono-Regular",Consolas,monospace;text-transform:uppercase;opacity:.78}.header-switch select:hover,.header-switch select:focus{opacity:1;border-color:var(--green)}
.space-switch,.section-switch{font:800 8px/1 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--muted)}
.space-switch select,.section-switch select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 28px 6px 8px;color:var(--ink);font:800 9px "SFMono-Regular",Consolas,monospace;text-transform:uppercase}
.main{margin-top:6px}
.panel{background:rgba(241,240,232,.94);border:1px solid #a6aaa2;border-radius:6px;box-shadow:var(--shadow)}
.panel-head{padding:12px 14px;border-bottom:1px solid #b7bab2;display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel-head h2,.panel-head h3{margin:0;font:850 11px/1.15 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;letter-spacing:.07em}
body[data-theme="night"] .panel{background:rgba(12,18,25,.95);border-color:var(--line)}
body[data-theme="night"] .panel-head{border-color:var(--line)}
body[data-theme="night"] .card,body[data-theme="night"] .topic,body[data-theme="night"] .editor-section{background:var(--paper2);border-color:var(--line)}
body[data-theme="night"] .card:hover,body[data-theme="night"] .topic:hover{background:#111e28;border-color:var(--green)}
body[data-theme="night"] .note-body{color:#aec5d3}
body[data-theme="night"] .qrow,body[data-theme="night"] .note,body[data-theme="night"] .mrow,body[data-theme="night"] .daily-entry{border-color:var(--line)}
body[data-theme="night"] .modal,body[data-theme="night"] .modal-head{background:var(--paper);border-color:var(--line)}
body[data-theme="night"] .field input,body[data-theme="night"] .field select,body[data-theme="night"] .field textarea{background:#080d12;color:var(--ink);border-color:var(--line)}
.code{font:800 9px/1 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:13px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:13px}.metric{padding:13px 14px;min-height:92px}.metric .tiny{font:800 9px/1 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--green)}.metric .value{font-size:30px;font-weight:780;letter-spacing:-.045em;margin-top:8px}.metric .label{font-size:11px;color:var(--muted);margin-top:2px}
.hero-grid{grid-template-columns:minmax(0,1.75fr) minmax(300px,.65fr)}
.network-stage{position:relative;background:transparent;border:0;box-shadow:none}
.network-head{padding:8px 2px 10px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.network-head h2{margin:0;font:850 11px/1.15 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;letter-spacing:.07em}
.map-wrap{position:relative;padding:0;min-height:625px;overflow:hidden;background:transparent}
.home-network{margin-top:-2px}
.home-network .map-wrap{min-height:780px}
.home-network #network{height:780px}
body[data-theme="night"] .map-wrap{background:transparent}
#network{width:100%;height:620px;display:block;touch-action:none;cursor:grab}
#network.is-panning{cursor:grabbing}
.edge{stroke:#878e86;stroke-width:1.1;opacity:.54}.edge.cross{stroke:var(--green);stroke-dasharray:4 4;stroke-width:1.4;opacity:.75}
.node{cursor:pointer}.node circle{fill:#eeede5;stroke:#697169;stroke-width:1.4;transition:.15s}.node:hover circle{fill:#d8ddd5;stroke:var(--green);stroke-width:2}.node.active circle{fill:#d7e0d5;stroke:var(--green);stroke-width:2.4}.node.project circle{fill:#e8e0d0;stroke:var(--amber)}.node.note circle{fill:#e5e5dc;stroke:#8d938a}
body[data-theme="night"] .edge{stroke:#30546a;opacity:.62}
body[data-theme="night"] .edge.cross{stroke:var(--green);opacity:.9}
body[data-theme="night"] .node circle{fill:#091019;stroke:#31566c}
body[data-theme="night"] .node:hover circle{fill:#0d1b26;stroke:var(--green)}
body[data-theme="night"] .node.active circle{fill:#0b2331;stroke:var(--green)}
body[data-theme="night"] .node.note circle{fill:#081017;stroke:#365e74}
body[data-theme="night"] .node text{fill:#bfe9ff}.node text{pointer-events:none;text-anchor:middle;font-family:"SFMono-Regular",Consolas,monospace;fill:var(--ink);font-weight:800;letter-spacing:.02em}.node .sub{fill:var(--muted);font-weight:650}.node.level1 .label{font-size:14px}.node.level2 .label{font-size:11px}.node.level3 .label{font-size:9.8px}.node.level4 .label{font-size:8.3px}.node.level5 .label{font-size:7.2px}.node .sub{font-size:7px}
.map-controls{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:end;pointer-events:none}.map-controls>*{pointer-events:auto}.map-hud{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.depth,.zoom-controls{background:rgba(239,238,230,.86);border:1px solid rgba(157,163,154,.72);border-radius:4px;padding:7px 8px;display:flex;align-items:center;gap:8px;font:800 9px "SFMono-Regular",Consolas,monospace;text-transform:uppercase;backdrop-filter:blur(5px)}.depth input{width:115px;accent-color:var(--green)}.zoom-controls{gap:4px;padding:4px}.zoom-controls button{width:30px;height:30px;padding:0;border:0;background:transparent;color:var(--ink);font:850 14px/1 "SFMono-Regular",Consolas,monospace;border-radius:3px}.zoom-controls button:hover{background:var(--green);color:#f3f1e8}.zoom-controls .zoom-reset{width:54px;font-size:9px}.legend{display:flex;gap:9px;flex-wrap:wrap;background:rgba(239,238,230,.82);border:1px solid rgba(157,163,154,.68);border-radius:4px;padding:8px;font:750 8px "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--muted);backdrop-filter:blur(5px)}.legend i{display:inline-block;border:1.5px solid var(--green);border-radius:50%;vertical-align:middle;margin-right:4px}.legend .l2{width:14px;height:14px}.legend .l3{width:11px;height:11px}.legend .l4{width:8px;height:8px}.legend .l5{width:6px;height:6px}
body[data-theme="night"] .depth,body[data-theme="night"] .zoom-controls,body[data-theme="night"] .legend{background:rgba(5,8,12,.78);border-color:rgba(37,55,70,.78)}
body[data-theme="night"] .zoom-controls button:hover{color:#031018}
.side{display:grid;gap:13px;align-content:start}.queue{padding:7px 11px 11px}.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:9px;padding:10px 2px;border-bottom:1px solid #d0d3cb;align-items:start}.qrow:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin-top:4px}.dot.amber{background:var(--amber)}.dot.grey{background:#8d938b}.qname{font-size:12px;font-weight:750}.qmeta{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}.badge{font:800 8px/1 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;border:1px solid #939a91;padding:4px 5px;border-radius:3px;color:var(--muted)}
.section{margin-top:13px}.workspace-head{display:flex;justify-content:space-between;gap:16px;align-items:end;padding:2px 0 12px}.workspace-title .crumb{font:800 9px/1 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--green)}.workspace-title h2{margin:5px 0 3px;font-size:28px;letter-spacing:-.035em}.workspace-title p{margin:0;color:var(--muted);font-size:12px}.subtabs{border-bottom:1px solid var(--line);padding-bottom:8px}.subtabs .tab{padding:7px 9px;font-size:9px}.workspace{margin-top:12px}.workspace-grid{grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:11px}.card{border:1px solid #a9aea6;background:#ecebe3;border-radius:5px;padding:13px}.clickable{cursor:pointer}.clickable:hover{border-color:var(--green);background:#e8eae1}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.card h4{margin:0;font-size:14px;letter-spacing:-.015em}.card p{font-size:11px;line-height:1.45;color:var(--muted);margin:6px 0 0}.progress{height:7px;background:#d0d3cb;border:1px solid #b4b9b0;border-radius:2px;overflow:hidden;margin-top:12px}.bar{height:100%;background:var(--green)}.card-foot{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font:750 9px/1.35 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--muted)}
.milestones{padding:9px 13px 13px}.mrow{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #d0d3cb;align-items:center}.mrow:last-child{border-bottom:0}.mark{width:12px;height:12px;border:1.5px solid #818880;border-radius:50%}.mark.done{background:var(--green);border-color:var(--green)}.mark.current{border:3px solid var(--amber)}.mname{font-size:12px}.mmeta{font:750 8px "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--muted)}
.notes-list{padding:8px 12px 12px}.note{padding:11px 2px;border-bottom:1px solid #d0d3cb}.note:last-child{border-bottom:0}.note-top{display:flex;justify-content:space-between;gap:9px}.note-title{font-size:13px;font-weight:760}.note-type{font:800 8px "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--green)}.note-body{font-size:11.5px;color:#3e463f;line-height:1.5;margin-top:5px;white-space:pre-wrap}.meta{font:750 8.5px "SFMono-Regular",Consolas,monospace;color:var(--muted);text-transform:uppercase;margin-top:7px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font:750 8px "SFMono-Regular",Consolas,monospace;text-transform:uppercase;border:1px solid #9ca299;border-radius:3px;padding:3px 5px;color:var(--muted)}
.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:10px}.topic{border:1px solid #b0b4ac;background:#ecebe3;border-radius:5px;padding:11px;cursor:pointer}.topic:hover{border-color:var(--green)}.topic .k{font:800 8px "SFMono-Regular",Consolas,monospace;text-transform:uppercase;color:var(--green)}.topic strong{display:block;margin-top:4px;font-size:12px}.topic span{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}
.daily{padding:13px}.day-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.day-title{font-size:18px;font-weight:780}.daily-entry{padding:10px 0;border-bottom:1px solid #d0d3cb}.daily-entry:last-child{border-bottom:0}.daily-time{font:800 8px "SFMono-Regular",Consolas,monospace;color:var(--muted);text-transform:uppercase}.daily-text{font-size:12px;line-height:1.45;margin-top:3px}
.empty{padding:22px;color:var(--muted);text-align:center;border:1px dashed #adb2aa;border-radius:5px;font-size:11px}
.footer{text-align:right;color:var(--muted);font:750 8px/1.5 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;padding-top:16px}

.home-stack{display:grid;gap:10px;margin-top:13px}
.fold{border:1px solid #a6aaa2;border-radius:6px;background:rgba(241,240,232,.94);box-shadow:var(--shadow);overflow:hidden}
.fold>summary{list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 14px;cursor:pointer;font:850 10px/1.2 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;letter-spacing:.07em}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:after{content:"+";font-size:16px;line-height:1;color:var(--muted)}
.fold[open]>summary:after{content:"−";color:var(--green)}
.fold[open]>summary{border-bottom:1px solid #b7bab2}
.fold-body{padding:11px}
.fold-body .metrics{margin-bottom:0}
body[data-theme="night"] .fold{background:rgba(12,18,25,.95);border-color:var(--line)}
body[data-theme="night"] .fold[open]>summary{border-color:var(--line)}
.home-queues{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:850px){.home-queues{grid-template-columns:1fr}.home-network .map-wrap{min-height:580px}.home-network #network{height:575px}}

/* overlays */

<div class="overlay" id="searchOverlay">

function applyWideMapLayout(s){

    const ox=Number.isFinite(Number(a.x))?Number(a.x):450, oy=Number.isFinite(Number(a.y))?Number(a.y):260;

  return s;
}
function organiseHierarchyLayout(s){

    return String(a.name||a.id).localeCompare(String(b.name||b.id));

function navItems(){return [{id:'work',name:'Work'},{id:'lifestyle',name:'Lifestyle'},{id:'creative',name:'Creative'},{id:'daily',name:'Daily'},{id:'inbox',name:`Inbox ${inboxCount()?`· ${inboxCount()}`:''}`}]} function inboxCount(){return state.notes.filter(n=>!n.areaId).length}

function renderTabs(){const el=document.getElementById('sectionSelect');if(el){el.innerHTML=`<option value="">Navigate</option>`+navItems().map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');el.value=state.settings.activeTab==='home'?'':state.settings.activeTab}document.getElementById('spaceFilter').value=state.settings.spaceFilter}
function renderAll(){applyTheme();renderTabs();const tab=state.settings.activeTab;if(tab==='home')renderHome();else if(tab==='daily')renderDaily();else if(tab==='inbox')renderInbox();else{const selected=areaById(state.settings.selectedArea);const top=selected?getTopDomain(selected):null;renderArea(top?.id===tab?selected.id:tab)}save()}
function metric(label,value,detail){return `<div class="panel metric"><div class="tiny">${esc(label)}</div><div class="value">${esc(value)}</div><div class="label">${esc(detail)}</div></div>`}
function metricsHtml(scope){const ps=visibleProjects(scope),ns=visibleNotes(scope);const active=ps.filter(p=>p.status==='ACTIVE').length;const milestones=ps.flatMap(p=>p.milestones||[]),openM=milestones.filter(m=>!m.done).length;const topics=state.areas.filter(a=>spaceAllows(a.space)&&(!scope? a.level>=3 : a.parentId===scope)).length;return `<section class="grid metrics">${metric('Active projects',active,'currently moving')}${metric('Open milestones',openM,'across visible projects')}${metric('Linked notes',ns.length,'knowledge records')}${metric('Topics',topics,'visible knowledge nodes')}</section>`}
function queueHtml(items,title,code){return `<div class="panel"><div class="panel-head"><h3>${title}</h3><span class="code">${code}</span></div><div class="queue">${items.length?items.map(i=>`<div class="qrow"><i class="dot ${statusDot(i.status)}"></i><div><div class="qname">${esc(i.name)}</div><div class="qmeta">${esc(i.meta)}</div></div><span class="badge">${esc(i.badge||'OPEN')}</span></div>`).join(''):'<div class="empty">Nothing here.</div>'}</div></div>`}
function getNext(scope){return visibleProjects(scope).filter(p=>p.status==='ACTIVE'||p.status==='WATCHING').slice(0,4).map(p=>({name:p.next||p.title,meta:p.title,status:p.status,badge:p.status}))}
function getWatch(scope){return visibleProjects(scope).filter(p=>p.status!=='COMPLETE').flatMap(p=>(p.milestones||[]).filter(m=>m.current||(!m.done&&p.status==='WATCHING')).slice(0,1).map(m=>({name:m.title,meta:p.title,status:p.status,badge:m.current?'CURRENT':'WATCH'}))).slice(0,4)}

function networkPanel(scope=null){const hero=!scope;return `<section class="network-stage ${hero?'home-network':'area-network'}">${scope?`<div class="network-head"><h2>${esc(areaById(scope)?.name||'Area')} Network</h2><span class="code">OPEN CANVAS · DRAG NODES · DRAG SPACE TO PAN</span></div>`:''}<div class="map-wrap"><svg id="network" viewBox="0 0 1200 680" role="img" aria-label="Atlas relationship map"></svg><div class="map-controls"><div class="map-hud"><div class="zoom-controls" aria-label="Map zoom controls"><button type="button" data-map-zoom="out" aria-label="Zoom out">−</button><button type="button" class="zoom-reset" data-map-zoom="reset" aria-label="Reset map zoom"><span id="zoomValue">FIT</span></button><button type="button" data-map-zoom="in" aria-label="Zoom in">+</button></div><div class="zoom-controls" aria-label="Map layout controls"><button type="button" class="zoom-reset" data-map-layout="organise" aria-label="Organise network">Organise</button></div><div class="depth">Depth <input id="depthRange" type="range" min="2" max="5" step="1" value="${state.settings.mapDepth}" /><strong id="depthValue">${state.settings.mapDepth}</strong></div></div><div class="legend"><span><i class="l2"></i>Domain</span><span><i class="l3"></i>Area</span><span><i class="l4"></i>Topic</span><span><i class="l5"></i>Note</span></div></div></div></section>`}
function foldPanel(title,code,body,open=false){return `<details class="fold" ${open?'open':''}><summary><span>${esc(title)}</span><span class="code">${esc(code)}</span></summary><div class="fold-body">${body}</div></details>`}
function queueRows(items){return `<div class="queue">${items.length?items.map(i=>`<div class="qrow"><i class="dot ${statusDot(i.status)}"></i><div><div class="qname">${esc(i.name)}</div><div class="qmeta">${esc(i.meta)}</div></div><span class="badge">${esc(i.badge||'OPEN')}</span></div>`).join(''):'<div class="empty">Nothing here.</div>'}</div>`}
function renderHome(){const app=document.getElementById('app');const activity=`<div class="notes-list">${state.activity.slice(0,8).map(a=>`<div class="note"><div class="meta">${fmtDate(a.time)} · ${fmtTime(a.time)}</div><div class="note-body">${esc(a.text)}</div></div>`).join('')}</div>`;app.innerHTML=`${networkPanel(null)}<section class="home-stack">${foldPanel('Dashboard','SNAPSHOT',metricsHtml(null),true)}${foldPanel('Active now','NEXT MOVES',queueRows(getNext(null)))}${foldPanel('Milestones','CURRENT / WATCH',queueRows(getWatch(null)))}${foldPanel('Projects','ALL SPACES',projectCards(null))}${foldPanel('Recent notes','KNOWLEDGE',notesHtml(visibleNotes(null).slice(0,8)))}${foldPanel('Recent activity','SYSTEM LOG',activity)}</section>`;drawNetwork(null)}
function childAreas(id){return state.areas.filter(a=>a.parentId===id&&spaceAllows(a.space))}
function renderArea(id){const a=areaById(id);if(!a){state.settings.activeTab='home';return renderAll()}const subs=['overview','notes','projects','milestones','map'];const app=document.getElementById('app');app.innerHTML=`<div class="workspace-head"><div class="workspace-title"><div class="crumb">ATLAS / ${esc(a.space)} / ${esc(a.code)}</div><h2>${esc(a.name)}</h2><p>${esc(a.description)}</p></div><div class="inline-actions"><button class="btn primary" data-quick-add="note" data-area="${a.id}">+ Note</button><button class="btn" data-quick-add="project" data-area="${a.id}">+ Project</button></div></div><nav class="subtabs">${subs.map(s=>`<button class="tab ${state.settings.subtab===s?'active':''}" data-subtab="${s}">${s}</button>`).join('')}</nav><div class="workspace" id="workspace"></div>`;renderWorkspace(a.id)}
function renderWorkspace(id){const el=document.getElementById('workspace');if(!el)return;const st=state.settings.subtab;if(st==='overview'){el.innerHTML=`${metricsHtml(id)}<section class="grid workspace-grid"><div class="panel"><div class="panel-head"><h3>Projects</h3><span class="code">ACTIVE / WATCHING</span></div>${projectCards(id)}</div><div class="side">${queueHtml(getNext(id),'Next moves','PROJECT QUEUE')}${queueHtml(getWatch(id),'Milestones','CURRENT')}</div></section><section class="grid workspace-grid section"><div class="panel"><div class="panel-head"><h3>Recent Notes</h3><span class="code">LINKED</span></div>${notesHtml(visibleNotes(id).slice(0,8))}</div><div class="panel"><div class="panel-head"><h3>Topics</h3><span class="code">CHILD NODES</span></div>${topicsHtml(id)}</div></section>`}
else if(st==='notes')el.innerHTML=`<section class="panel"><div class="panel-head"><h3>Notes</h3><button class="btn small primary" data-quick-add="note" data-area="${id}">+ Add Note</button></div>${notesHtml(visibleNotes(id))}</section>`;
else if(st==='projects')el.innerHTML=`<section class="panel"><div class="panel-head"><h3>Projects</h3><button class="btn small primary" data-quick-add="project" data-area="${id}">+ New Project</button></div>${projectCards(id)}</section>`;
else if(st==='milestones')el.innerHTML=`<section class="panel"><div class="panel-head"><h3>Milestones</h3><span class="code">ALL LINKED PROJECTS</span></div>${milestonesHtml(id)}</section>`;
else if(st==='map'){el.innerHTML=networkPanel(id);drawNetwork(id)}}
function topicsHtml(id){const kids=childAreas(id);return `<div class="topic-grid">${kids.length?kids.map(k=>`<div class="topic" data-open-area="${k.id}"><div class="k">${esc(k.code)} · L${k.level}</div><strong>${esc(k.name)}</strong><span>${esc(k.description)}</span></div>`).join(''):'<div class="empty">No child topics yet.</div>'}</div>`}
function projectCards(scope){const ps=visibleProjects(scope);return `<div class="cards">${ps.length?ps.map(p=>{const pc=projectProgress(p);return `<article class="card clickable" data-project="${p.id}"><div class="card-top"><div><div class="code">${esc(p.code)}</div><h4>${esc(p.title)}</h4></div><span class="badge">${esc(p.status)}</span></div><p>${esc(p.next||p.objective)}</p><div class="progress"><div class="bar" style="width:${pc}%"></div></div><div class="card-foot"><span>${pc}% milestone progress</span><span>${(p.milestones||[]).filter(m=>!m.done).length} open</span></div></article>`}).join(''):'<div class="empty" style="grid-column:1/-1">No projects in this area yet.</div>'}</div>`}
function notesHtml(notes){return `<div class="notes-list">${notes.length?notes.map(n=>`<article class="note"><div class="note-top"><div class="note-title">${esc(n.title||'Untitled')}</div><span class="note-type">${esc(n.type)}</span></div><div class="note-body">${esc(n.body||'')}</div><div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="meta">${fmtDate(n.createdAt)} · ${esc(areaById(n.topicId)?.name||areaById(n.areaId)?.name||'Inbox')}</div></article>`).join(''):'<div class="empty">No notes yet.</div>'}</div>`}
function milestonesHtml(scope){const ps=visibleProjects(scope);const rows=ps.flatMap(p=>(p.milestones||[]).map(m=>({m,p})));return `<div class="milestones">${rows.length?rows.map(({m,p})=>`<div class="mrow"><i class="mark ${m.done?'done':m.current?'current':''}"></i><div><div class="mname">${esc(m.title)}</div><div class="mmeta">${esc(p.title)}</div></div><span class="badge">${m.done?'DONE':m.current?'CURRENT':'OPEN'}</span></div>`).join(''):'<div class="empty">No milestones yet.</div>'}</div>`}

function renderDaily(){const entries=state.daily.filter(d=>d.date===todayKey()).sort((a,b)=>b.createdAt-a.createdAt);document.getElementById('app').innerHTML=`<div class="workspace-head"><div class="workspace-title"><div class="crumb">ATLAS / DAILY</div><h2>${new Intl.DateTimeFormat('en-AU',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</h2><p>Capture first. Organise later.</p></div><button class="btn primary" data-quick-add="daily">+ Daily entry</button></div>${metricsHtml(null)}<section class="grid workspace-grid"><div class="panel"><div class="panel-head"><h3>Today</h3><span class="code">${todayKey()}</span></div><div class="daily">${entries.length?entries.map(d=>`<div class="daily-entry"><div class="daily-time">${fmtTime(d.createdAt)} · ${esc(areaById(d.areaId)?.name||'Unlinked')}</div><div class="daily-text">${esc(d.text)}</div></div>`).join(''):'<div class="empty">Nothing captured today.</div>'}</div></div><div class="side">${queueHtml(getNext(null),'Open loops','PROJECTS')}${queueHtml(getWatch(null),'Current milestones','MILESTONES')}</div></section>`}
function renderInbox(){const notes=state.notes.filter(n=>!n.areaId).sort((a,b)=>b.createdAt-a.createdAt);document.getElementById('app').innerHTML=`<div class="workspace-head"><div class="workspace-title"><div class="crumb">ATLAS / INBOX</div><h2>Inbox</h2><p>Unsorted notes and ideas. Link them to an area when their home becomes clear.</p></div><button class="btn primary" data-quick-add="note">+ Capture</button></div><section class="panel"><div class="panel-head"><h3>Unsorted</h3><span class="code">${notes.length} ITEMS</span></div>${notesHtml(notes)}</section>`}

function graphData(scope){
  const max=state.settings.mapDepth; const nodes=[{id:'atlas',name:'Atlas',code:'ATLAS',space:'core',level:1,parentId:'',description:'',x:600,y:340,status:'active'}];
  let areas=state.areas.filter(a=>spaceAllows(a.space)&&a.level<=max);
  if(scope){const include=new Set([scope]);let cur=areaById(scope);while(cur){include.add(cur.id);cur=areaById(cur.parentId)}state.areas.forEach(a=>{if(a.id===scope||isDescendant(a.id,scope))include.add(a.id)});areas=areas.filter(a=>include.has(a.id))}
  nodes.push(...areas);
  if(max>=5){const noteGroups={};state.notes.filter(n=>n.showOnMap&&spaceAllows(n.space)&&(!scope||n.areaId===scope||n.topicId===scope||isDescendant(n.topicId||n.areaId,scope))).forEach(n=>{const par=areaById(n.topicId)||areaById(n.areaId);const pid=par?.id||'';(noteGroups[pid]||(noteGroups[pid]=[])).push({n,par})});Object.values(noteGroups).forEach(group=>{group.sort((a,b)=>String(a.n.title||'').localeCompare(String(b.n.title||'')));const par=group[0]?.par;if(!par)return;const ang=Math.atan2((par.y||340)-340,(par.x||600)-600);const ux=Math.cos(ang),uy=Math.sin(ang),vx=-uy,vy=ux;const spacing=42;group.forEach(({n},i)=>{const off=(i-(group.length-1)/2)*spacing;nodes.push({id:n.id,name:n.title,code:makeNodeCode(n.title),space:n.space,level:5,parentId:par.id,description:'',x:Math.round(par.x+ux*92+vx*off),y:Math.round(par.y+uy*92+vy*off),status:'default',note:true})})})}
  const ids=new Set(nodes.map(n=>n.id));const links=[];nodes.forEach(n=>{if(n.parentId&&ids.has(n.parentId))links.push({source:n.parentId,target:n.id,type:'tree'})});state.links.forEach(l=>{if(ids.has(l.source)&&ids.has(l.target))links.push(l)});return {nodes,links}
}
function radius(level){return({1:54,2:43,3:33,4:24,5:15})[level]||20}
const mapCameras={};
function mapCamera(scope){const key=scope||'home';if(!mapCameras[key])mapCameras[key]={cx:600,cy:340,zoom:1,needsFit:true};return mapCameras[key]}
function mapView(scope){const c=mapCamera(scope),z=Math.max(.15,Math.min(6,c.zoom||1));c.zoom=z;const w=1200/z,h=680/z;return{x:c.cx-w/2,y:c.cy-h/2,w,h,z}}
function applyMapView(svg,scope){const v=mapView(scope);svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);const zv=document.getElementById('zoomValue');if(zv)zv.textContent=`${Math.round(v.z*100)}%`}
function setFitCamera(scope,nodes){const c=mapCamera(scope);if(!nodes?.length){c.cx=600;c.cy=340;c.zoom=1;c.needsFit=false;return}let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;nodes.forEach(n=>{const r=radius(n.level)+34;minX=Math.min(minX,n.x-r);maxX=Math.max(maxX,n.x+r);minY=Math.min(minY,n.y-r);maxY=Math.max(maxY,n.y+r)});const bw=Math.max(300,maxX-minX),bh=Math.max(220,maxY-minY);c.cx=(minX+maxX)/2;c.cy=(minY+maxY)/2;c.zoom=Math.max(.15,Math.min(1.15,Math.min(1200/(bw+110),680/(bh+110))));c.needsFit=false}
function fitMap(scope){const svg=document.getElementById('network');const gd=graphData(scope);setFitCamera(scope,gd.nodes);if(svg)applyMapView(svg,scope)}
function zoomMap(scope,factor,clientX=null,clientY=null){const svg=document.getElementById('network');if(!svg)return;const c=mapCamera(scope),old=mapView(scope),nextZoom=Math.max(.15,Math.min(6,old.z*factor));if(Math.abs(nextZoom-old.z)<.001)return;const rect=svg.getBoundingClientRect();let px=.5,py=.5;if(clientX!==null&&clientY!==null&&rect.width&&rect.height){px=(clientX-rect.left)/rect.width;py=(clientY-rect.top)/rect.height}const anchorX=old.x+px*old.w,anchorY=old.y+py*old.h,newW=1200/nextZoom,newH=680/nextZoom;c.zoom=nextZoom;c.cx=anchorX+(0.5-px)*newW;c.cy=anchorY+(0.5-py)*newH;c.needsFit=false;applyMapView(svg,scope)}
function resetMapView(scope){fitMap(scope)}
function clientToSvg(svg,clientX,clientY){const p=svg.createSVGPoint();p.x=clientX;p.y=clientY;const ctm=svg.getScreenCTM();return ctm?p.matrixTransform(ctm.inverse()):{x:clientX,y:clientY}}
function drawNetwork(scope){const svg=document.getElementById('network');if(!svg)return;svg.dataset.scope=scope||'';svg.innerHTML='';const {nodes,links}=graphData(scope);const cam=mapCamera(scope);if(cam.needsFit)setFitCamera(scope,nodes);applyMapView(svg,scope);const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));links.forEach(l=>{const s=byId[l.source],t=byId[l.target];if(!s||!t)return;const line=document.createElementNS(SVG_NS,'line');line.setAttribute('x1',s.x);line.setAttribute('y1',s.y);line.setAttribute('x2',t.x);line.setAttribute('y2',t.y);line.setAttribute('class',`edge ${l.type==='cross'?'cross':''}`);line.dataset.source=l.source;line.dataset.target=l.target;svg.appendChild(line)});nodes.forEach(n=>{const g=document.createElementNS(SVG_NS,'g');g.setAttribute('class',`node level${n.level} ${n.id===scope?'active':''} ${n.note?'note':''}`);g.dataset.node=n.id;const c=document.createElementNS(SVG_NS,'circle');c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',radius(n.level));g.appendChild(c);const title=document.createElementNS(SVG_NS,'title');title.textContent=n.name;g.appendChild(title);const tx=document.createElementNS(SVG_NS,'text');tx.setAttribute('x',n.x);tx.setAttribute('y',n.y+3);tx.setAttribute('class','label');tx.textContent=n.id==='atlas'?'ATLAS':(n.code||makeNodeCode(n.name));g.appendChild(tx);svg.appendChild(g)});bindNetwork(scope);const dr=document.getElementById('depthRange');if(dr){dr.oninput=e=>{state.settings.mapDepth=Number(e.target.value);document.getElementById('depthValue').textContent=e.target.value;drawNetwork(scope);save()}}document.querySelectorAll('[data-map-zoom]').forEach(b=>{b.onclick=()=>{const a=b.dataset.mapZoom;if(a==='in')zoomMap(scope,1.2);else if(a==='out')zoomMap(scope,1/1.2);else resetMapView(scope)}});document.querySelectorAll('[data-map-layout]').forEach(b=>{b.onclick=()=>{organiseHierarchyLayout(state);const gd=graphData(scope);setFitCamera(scope,gd.nodes);save();drawNetwork(scope);toast('Network organised')}})}
function shortLabel(s,l){const lim={1:14,2:14,3:16,4:15,5:12}[l]||14;return String(s).length>lim?String(s).slice(0,lim-1)+'…':s}
function bindNetwork(scope){const svg=document.getElementById('network');if(!svg||svg.dataset.bound==='yes')return;svg.dataset.bound='yes';svg.addEventListener('pointerdown',e=>{const g=e.target.closest?.('.node');if(!g){const cam=mapCamera(svg.dataset.scope||null);dragging={kind:'pan',startX:e.clientX,startY:e.clientY,origCx:cam.cx,origCy:cam.cy,moved:false,pointerId:e.pointerId};svg.classList.add('is-panning');svg.setPointerCapture(e.pointerId);return}const id=g.dataset.node;if(id==='atlas'||id.startsWith('n')){dragging={kind:'node',id,startX:e.clientX,startY:e.clientY,moved:false,pointerId:e.pointerId};svg.setPointerCapture(e.pointerId);return}const a=areaById(id);if(!a)return;const p=clientToSvg(svg,e.clientX,e.clientY);dragging={kind:'node',id,startX:e.clientX,startY:e.clientY,startSvgX:p.x,startSvgY:p.y,origX:a.x,origY:a.y,moved:false,pointerId:e.pointerId};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!dragging)return;if(dragging.kind==='pan'){const cam=mapCamera(svg.dataset.scope||null),v=mapView(svg.dataset.scope||null),rect=svg.getBoundingClientRect();const dx=(e.clientX-dragging.startX)*v.w/rect.width,dy=(e.clientY-dragging.startY)*v.h/rect.height;if(Math.abs(dx)+Math.abs(dy)>2)dragging.moved=true;cam.cx=dragging.origCx-dx;cam.cy=dragging.origCy-dy;applyMapView(svg,svg.dataset.scope||null);return}if(dragging.id==='atlas'||dragging.id.startsWith('n'))return;const a=areaById(dragging.id);if(!a)return;const p=clientToSvg(svg,e.clientX,e.clientY),dx=p.x-dragging.startSvgX,dy=p.y-dragging.startSvgY;if(Math.abs(e.clientX-dragging.startX)+Math.abs(e.clientY-dragging.startY)>3)dragging.moved=true;a.x=dragging.origX+dx;a.y=dragging.origY+dy;mapCamera(svg.dataset.scope||null).needsFit=false;drawNetwork(svg.dataset.scope||null)});svg.addEventListener('pointerup',e=>{if(!dragging)return;const d=dragging;try{svg.releasePointerCapture(d.pointerId)}catch(_){ }dragging=null;svg.classList.remove('is-panning');if(d.kind==='pan')return;const moved=d.moved,id=d.id;if(moved){save();return}if(id==='atlas'){state.settings.activeTab='home';renderAll();return}if(id.startsWith('n'))return;const a=areaById(id);if(a){state.settings.activeTab=getTopDomain(a)?.id||a.id;state.settings.selectedArea=a.id;state.settings.subtab='overview';renderTabs();if(a.level>=3)renderArea(a.id);else renderAll();save()}});svg.addEventListener('pointercancel',()=>{dragging=null;svg.classList.remove('is-panning')});svg.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();zoomMap(svg.dataset.scope||null,e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false})}
function getTopDomain(a){let cur=a;while(cur&&cur.level>2)cur=areaById(cur.parentId);return cur}

function openProject(id){const p=projectById(id);if(!p)return;activeProjectId=id;document.getElementById('projectCode').textContent=`${p.code} / ${p.status}`;document.getElementById('projectTitle').textContent=p.title;document.getElementById('projectBody').innerHTML=`<div class="form"><div class="row2"><div><div class="code">OBJECTIVE</div><p style="font-size:12px;line-height:1.5">${esc(p.objective)}</p></div><div><div class="code">NEXT MOVE</div><p style="font-size:12px;line-height:1.5">${esc(p.next)}</p></div></div><div><div class="code">MILESTONES</div>${milestonesHtmlForProject(p)}</div><div><div class="code">TASKS</div><div class="mini-list">${(p.tasks||[]).map(t=>`<label class="mini-row"><input type="checkbox" data-project-task="${t.id}" ${t.done?'checked':''}/><span>${esc(t.title)}</span><span class="badge">${t.done?'DONE':'OPEN'}</span></label>`).join('')}</div></div><div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`;openOverlay('projectOverlay')}
function milestonesHtmlForProject(p){return `<div class="milestones" style="padding-left:0;padding-right:0">${(p.milestones||[]).map(m=>`<label class="mrow"><input type="checkbox" data-project-milestone="${m.id}" ${m.done?'checked':''} style="accent-color:var(--green)"/><div><div class="mname">${esc(m.title)}</div><div class="mmeta">${m.current?'CURRENT':''}</div></div><span class="badge">${m.done?'DONE':m.current?'CURRENT':'OPEN'}</span></label>`).join('')}</div>`}

function openCapture(type='note',areaId=''){document.getElementById('capType').value=type;populateAreaSelect(document.getElementById('capArea'),areaId);document.getElementById('capTitle').value='';document.getElementById('capBody').value='';document.getElementById('capTags').value='';document.getElementById('capMap').value='false';openOverlay('captureOverlay');setTimeout(()=>document.getElementById('capTitle').focus(),80)}
function populateAreaSelect(sel,value=''){const opts=state.areas.filter(a=>a.level>=2&&spaceAllows(a.space)).sort((a,b)=>a.name.localeCompare(b.name));sel.innerHTML=`<option value="">Inbox / unlinked</option>`+opts.map(a=>`<option value="${a.id}" ${a.id===value?'selected':''}>${esc(a.name)} · ${esc(a.code)}</option>`).join('')}
function saveCapture(){const type=document.getElementById('capType').value,areaId=document.getElementById('capArea').value,title=document.getElementById('capTitle').value.trim(),body=document.getElementById('capBody').value.trim(),tags=document.getElementById('capTags').value.split(',').map(s=>s.trim()).filter(Boolean),show=document.getElementById('capMap').value==='true';if(!title&&!body)return toast('Add some content first');const area=areaById(areaId);const space=area?.space||(state.settings.spaceFilter==='work'?'work':'personal');if(type==='project'){const p={id:uid('p'),space,areaId:areaId||'',topicId:'',code:`P-${String(state.projects.length+1).padStart(2,'0')}`,title:title||'New Project',status:'ACTIVE',objective:body,next:'',tags,createdAt:now(),milestones:[],tasks:[]};state.projects.unshift(p);log(`Project created: ${p.title}.`)}else if(type==='task'){let p=visibleProjects(areaId)[0];if(p){p.tasks.push({id:uid('t'),title:title||body,done:false});log(`Task added to ${p.title}: ${title||body}.`)}else{state.notes.unshift({id:uid('n'),space,areaId:areaId||'',topicId:'',type:'task',title:title||'Task',body,tags,createdAt:now(),showOnMap:show});log(`Unassigned task captured: ${title}.`)}}else if(type==='daily'){state.daily.unshift({id:uid('d'),date:todayKey(),createdAt:now(),text:[title,body].filter(Boolean).join(' — '),areaId});log('Daily entry captured.')}else{state.notes.unshift({id:uid('n'),space,areaId:areaId||'',topicId:area?.level>=4?area.id:'',type,title:title||body.slice(0,70)||'Untitled',body,tags,createdAt:now(),showOnMap:show});log(`${type} captured: ${title||'Untitled'}.`)}save();closeOverlay('captureOverlay');renderAll();toast('Saved to Atlas')}

function search(q){q=q.trim().toLowerCase();if(!q)return[];const res=[];state.areas.forEach(a=>{if([a.name,a.code,a.description].join(' ').toLowerCase().includes(q))res.push({kind:'AREA',title:a.name,meta:a.description,id:a.id})});state.projects.forEach(p=>{if([p.title,p.code,p.objective,p.next,...(p.tags||[])].join(' ').toLowerCase().includes(q))res.push({kind:'PROJECT',title:p.title,meta:p.next,id:p.id})});state.notes.forEach(n=>{if([n.title,n.body,...(n.tags||[])].join(' ').toLowerCase().includes(q))res.push({kind:'NOTE',title:n.title,meta:n.body,id:n.id,areaId:n.areaId})});return res.slice(0,30)}
function renderSearch(){const q=document.getElementById('searchInput').value;const r=search(q);document.getElementById('searchResults').innerHTML=q?`<div class="notes-list">${r.length?r.map(x=>`<div class="note clickable" data-search-kind="${x.kind}" data-search-id="${x.id}" data-search-area="${x.areaId||''}"><div class="note-top"><strong class="note-title">${esc(x.title)}</strong><span class="note-type">${x.kind}</span></div><div class="note-body">${esc(String(x.meta||'').slice(0,180))}</div></div>`).join(''):'<div class="empty">No matches.</div>'}</div>`:'<div class="empty">Search projects, notes, topics, codes or tags.</div>'}

const editorTabs=[['structure','Structure'],['projects','Projects'],['notes','Notes'],['links','Connections'],['security','Security'],['data','Data / Reset']];
function openEditor(){renderEditor();openOverlay('editorOverlay')}
function renderEditor(){document.getElementById('editorNav').innerHTML=editorTabs.map(([id,n])=>`<button class="btn ${state.settings.editorTab===id?'primary':''}" data-editor-tab="${id}">${n}</button>`).join('');const e=document.getElementById('editorPane');if(state.settings.editorTab==='structure')e.innerHTML=editorStructure();if(state.settings.editorTab==='projects')e.innerHTML=editorProjects();if(state.settings.editorTab==='notes')e.innerHTML=editorNotes();if(state.settings.editorTab==='links')e.innerHTML=editorLinks();if(state.settings.editorTab==='security')e.innerHTML=editorSecurity();if(state.settings.editorTab==='data')e.innerHTML=editorData()}
function field(label,html){return `<div class="field"><label>${label}</label>${html}</div>`}
function editorStructure(){return `<section class="editor-section"><div class="editor-section-head"><h4>Areas / Topics</h4><button class="btn small primary" data-ed-action="add-area">+ Add</button></div><div class="editor-section-body"><div class="table-list">${state.areas.map((a,i)=>`<div class="edit-row"><div>${field('Name',`<input data-area-edit="${i}" data-field="name" value="${esc(a.name)}">`)}</div><div>${field('Level',`<select data-area-edit="${i}" data-field="level">${[2,3,4].map(v=>`<option value="${v}" ${a.level===v?'selected':''}>${v}</option>`).join('')}</select>`)}</div><div>${field('Parent',`<select data-area-edit="${i}" data-field="parentId"><option value="atlas">ATLAS</option>${state.areas.filter(x=>x.id!==a.id&&x.level<a.level).map(x=>`<option value="${x.id}" ${a.parentId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}</div><div class="inline-actions"><button class="btn small" data-ed-action="edit-area" data-index="${i}">Detail</button><button class="btn small danger" data-ed-action="remove-area" data-index="${i}">×</button></div></div>`).join('')}</div></div></section><div class="code">Atlas uses a compact radial hierarchy across devices. Drag nodes for local tweaks, or use Organise to rebuild the bundled, collision-free layout.</div>`}
function editorProjects(){return `<section class="editor-section"><div class="editor-section-head"><h4>Projects</h4><button class="btn small primary" data-ed-action="add-project">+ Project</button></div><div class="editor-section-body"><div class="table-list">${state.projects.map((p,i)=>`<div class="edit-row project-row"><div>${field('Title',`<input data-proj-edit="${i}" data-field="title" value="${esc(p.title)}">`)}</div><div>${field('Status',`<select data-proj-edit="${i}" data-field="status">${['ACTIVE','WATCHING','PAUSED','COMPLETE'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select>`)}</div><div>${field('Area',`<select data-proj-edit="${i}" data-field="areaId">${state.areas.map(a=>`<option value="${a.id}" ${p.areaId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`)}</div><div class="inline-actions"><button class="btn small" data-ed-action="edit-project" data-index="${i}">Detail</button><button class="btn small danger" data-ed-action="remove-project" data-index="${i}">×</button></div></div>`).join('')}</div></div></section>`}
function editorNotes(){return `<section class="editor-section"><div class="editor-section-head"><h4>Notes</h4><button class="btn small primary" data-ed-action="add-note">+ Note</button></div><div class="editor-section-body"><div class="table-list">${state.notes.map((n,i)=>`<div class="edit-row note-row"><div>${field('Title',`<input data-note-edit="${i}" data-field="title" value="${esc(n.title)}">`)}</div><div>${field('Type',`<input data-note-edit="${i}" data-field="type" value="${esc(n.type)}">`)}</div><div>${field('Area',`<select data-note-edit="${i}" data-field="areaId"><option value="">Inbox</option>${state.areas.map(a=>`<option value="${a.id}" ${n.areaId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`)}</div><div class="inline-actions"><button class="btn small" data-ed-action="edit-note" data-index="${i}">Detail</button><button class="btn small danger" data-ed-action="remove-note" data-index="${i}">×</button></div></div>`).join('')}</div></div></section>`}
function editorLinks(){return `<section class="editor-section"><div class="editor-section-head"><h4>Cross-connections</h4><button class="btn small primary" data-ed-action="add-link">+ Connection</button></div><div class="editor-section-body"><div class="table-list">${state.links.map((l,i)=>`<div class="edit-row"><div>${field('From',`<select data-link-edit="${i}" data-field="source">${state.areas.map(a=>`<option value="${a.id}" ${l.source===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`)}</div><div>${field('To',`<select data-link-edit="${i}" data-field="target">${state.areas.map(a=>`<option value="${a.id}" ${l.target===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`)}</div><div>${field('Type',`<select data-link-edit="${i}" data-field="type"><option value="cross">Cross-link</option></select>`)}</div><button class="btn small danger" data-ed-action="remove-link" data-index="${i}">Remove</button></div>`).join('')}</div></div></section>`}
function editorSecurity(){if(authConfig?.enabled===false)return `<section class="editor-section"><div class="editor-section-head"><h4>Atlas Lock</h4><span class="code">DISABLED</span></div><div class="editor-section-body"><p style="font-size:11px;line-height:1.5;color:var(--muted)">Atlas Lock is disabled on this device.</p><div class="inline-actions"><button class="btn primary" data-ed-action="enable-lock">Enable Atlas Lock</button></div></div></section>`;const idle=Number(authConfig?.idleMinutes??15);return `<section class="editor-section"><div class="editor-section-head"><h4>Atlas Lock</h4><span class="code">${authConfig?.enabled?'ENABLED':'NOT CONFIGURED'}</span></div><div class="editor-section-body"><p style="font-size:11px;line-height:1.5;color:var(--muted)">Atlas Lock is local to this device and works offline. Password and recovery-key verifiers are stored separately from normal Atlas exports.</p>${recoveryAuthenticated?'<p style="font-size:10px;line-height:1.5;color:var(--amber);margin:0 0 10px">Recovery access is active. You can change the password below without entering the forgotten password.</p>':''}<div class="row2">${field('Auto-lock',`<select id="secIdle"><option value="5" ${idle===5?'selected':''}>5 minutes</option><option value="15" ${idle===15?'selected':''}>15 minutes</option><option value="30" ${idle===30?'selected':''}>30 minutes</option><option value="60" ${idle===60?'selected':''}>1 hour</option><option value="0" ${idle===0?'selected':''}>Never</option></select>`)}${field('Current password',`<input id="secCurrent" type="password" autocomplete="current-password" placeholder="${recoveryAuthenticated?'Recovery access active':'Required for security changes'}" ${recoveryAuthenticated?'disabled':''}>`)}</div><div class="row2">${field('New password',`<input id="secNew" type="password" autocomplete="new-password" placeholder="8+ characters">`)}${field('Confirm new password',`<input id="secConfirm" type="password" autocomplete="new-password">`)}</div><div class="inline-actions"><button class="btn primary" data-ed-action="save-security">Save Auto-lock</button><button class="btn" data-ed-action="change-password">Change Password</button><button class="btn" data-ed-action="new-recovery">New Recovery Key</button><button class="btn danger" data-ed-action="disable-lock">Disable Lock</button></div><p id="securityMessage" style="font:750 9px/1.5 SFMono-Regular,Consolas,monospace;color:var(--amber);margin-top:11px"></p><p style="font-size:10px;line-height:1.5;color:var(--muted);margin-top:12px">Current protection is an interface lock. Atlas records in IndexedDB are not yet encrypted at rest; that will be a separate security migration.</p></div></section>`}
async function verifyCurrentSecurityPassword(){if(recoveryAuthenticated)return true;const el=document.getElementById('secCurrent');const p=el?.value||'';if(!p)return false;try{const v=await deriveVerifier(p,authConfig.password.salt,authConfig.password.iterations);return safeEqual(v,authConfig.password.verifier)}catch(_){return false}}
function securityMsg(t){const e=document.getElementById('securityMessage');if(e)e.textContent=t||''}

function editorData(){const saved=state.meta?.lastSavedAt?`${fmtDate(state.meta.lastSavedAt)} · ${fmtTime(state.meta.lastSavedAt)}`:'—';return `<section class="editor-section"><div class="editor-section-head"><h4>Data</h4><span class="code">APP ${APP_VERSION} · DATA v${DATA_VERSION}</span></div><div class="editor-section-body"><p style="font-size:11px;line-height:1.5;color:var(--muted)">Atlas keeps your records separate from the interface code. On a fixed hosted Atlas URL, application updates reuse the same IndexedDB database and create an automatic snapshot before a new app/data version is applied.</p><div class="meta" style="margin:8px 0 12px">Last saved ${saved}</div><div class="inline-actions"><button class="btn" data-ed-action="snapshot">Create Snapshot</button><button class="btn" data-ed-action="restore-latest">Restore Latest Snapshot</button><button class="btn" data-ed-action="export">Export JSON</button><button class="btn danger" data-ed-action="reset">Reset Demo Data</button></div><p style="font-size:10px;line-height:1.5;color:var(--muted);margin-top:12px">Local downloaded <code>file://</code> copies are not a reliable update channel because browsers may treat different local file locations as different storage origins. Until Atlas is hosted at one stable URL, export JSON before replacing the local file.</p></div></section>`}
function openAreaEditor(i){const a=state.areas[i];if(!a)return;document.getElementById('editorPane').innerHTML=`<button class="btn small" data-ed-action="back-structure">← Structure</button><section class="editor-section" style="margin-top:9px"><div class="editor-section-head"><h4>${esc(a.code)} · Area Detail</h4></div><div class="editor-section-body"><div class="project-editor"><div class="row3">${field('Name',`<input id="eaName" value="${esc(a.name)}">`)}${field('Map code · auto',`<input id="eaCode" value="${esc(a.code)}" readonly title="Generated from the node name · 3–5 characters">`)}${field('Space',`<select id="eaSpace"><option value="work" ${a.space==='work'?'selected':''}>Work</option><option value="personal" ${a.space==='personal'?'selected':''}>Personal</option></select>`)}</div><div class="row2">${field('Level',`<select id="eaLevel">${[2,3,4].map(v=>`<option value="${v}" ${a.level===v?'selected':''}>${v}</option>`).join('')}</select>`)}${field('Parent',`<select id="eaParent"><option value="atlas">ATLAS</option>${state.areas.filter(x=>x.id!==a.id&&x.level<a.level).map(x=>`<option value="${x.id}" ${a.parentId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}</div>${field('Description',`<textarea id="eaDescription">${esc(a.description||'')}</textarea>`)}<button class="btn primary" data-ed-action="save-area-detail" data-index="${i}">Save Area</button></div></div></section>`}
function openNoteEditor(i){const n=state.notes[i];if(!n)return;document.getElementById('editorPane').innerHTML=`<button class="btn small" data-ed-action="back-notes">← Notes</button><section class="editor-section" style="margin-top:9px"><div class="editor-section-head"><h4>Note Detail</h4></div><div class="editor-section-body"><div class="project-editor"><div class="row2">${field('Title',`<input id="enTitle" value="${esc(n.title)}">`)}${field('Type',`<input id="enType" value="${esc(n.type)}">`)}</div><div class="row2">${field('Area',`<select id="enArea"><option value="">Inbox</option>${state.areas.map(a=>`<option value="${a.id}" ${n.areaId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`)}${field('Topic',`<select id="enTopic"><option value="">None</option>${state.areas.filter(a=>a.level>=3).map(a=>`<option value="${a.id}" ${n.topicId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`)}</div>${field('Body',`<textarea id="enBody" style="min-height:180px">${esc(n.body||'')}</textarea>`)}<div class="row2">${field('Tags',`<input id="enTags" value="${esc((n.tags||[]).join(', '))}">`)}${field('Map',`<select id="enMap"><option value="false" ${!n.showOnMap?'selected':''}>Keep off map</option><option value="true" ${n.showOnMap?'selected':''}>Show as level 5 node</option></select>`)}</div><button class="btn primary" data-ed-action="save-note-detail" data-index="${i}">Save Note</button></div></div></section>`}
function openProjectEditor(i){const p=state.projects[i];if(!p)return;document.getElementById('editorPane').innerHTML=`<button class="btn small" data-ed-action="back-projects">← Projects</button><section class="editor-section" style="margin-top:9px"><div class="editor-section-head"><h4>${esc(p.code)} · Project Detail</h4></div><div class="editor-section-body"><div class="project-editor"><div class="row2">${field('Title',`<input id="epTitle" value="${esc(p.title)}">`)}${field('Status',`<select id="epStatus">${['ACTIVE','WATCHING','PAUSED','COMPLETE'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select>`)}</div>${field('Objective',`<textarea id="epObjective">${esc(p.objective)}</textarea>`)}${field('Next move',`<textarea id="epNext">${esc(p.next)}</textarea>`)}${field('Tags',`<input id="epTags" value="${esc((p.tags||[]).join(', '))}">`)}<div><div class="editor-section-head" style="padding-left:0;padding-right:0"><h4>Milestones</h4><button class="btn small" data-ed-action="add-milestone" data-index="${i}">+ Milestone</button></div><div class="mini-list">${(p.milestones||[]).map((m,mi)=>`<div class="mini-row"><input type="checkbox" data-ep-milestone="${mi}" ${m.done?'checked':''}><input type="text" data-ep-milestone-title="${mi}" value="${esc(m.title)}"><button class="btn small danger" data-ed-action="remove-milestone" data-index="${i}" data-subindex="${mi}">×</button></div>`).join('')}</div></div><div><div class="editor-section-head" style="padding-left:0;padding-right:0"><h4>Tasks</h4><button class="btn small" data-ed-action="add-task" data-index="${i}">+ Task</button></div><div class="mini-list">${(p.tasks||[]).map((t,ti)=>`<div class="mini-row"><input type="checkbox" data-ep-task="${ti}" ${t.done?'checked':''}><input type="text" data-ep-task-title="${ti}" value="${esc(t.title)}"><button class="btn small danger" data-ed-action="remove-task" data-index="${i}" data-subindex="${ti}">×</button></div>`).join('')}</div></div><button class="btn primary" data-ed-action="save-project-detail" data-index="${i}">Save Project</button></div></div></section>`}

function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`atlas-backup-${todayKey()}.json`;a.click();URL.revokeObjectURL(url)}
function openOverlay(id){document.getElementById(id).classList.add('open')} function closeOverlay(id){document.getElementById(id).classList.remove('open')}

// Global click handling
document.addEventListener('click',e=>{
  const close=e.target.closest('[data-close]');if(close){closeOverlay(close.dataset.close);return}
  const mt=e.target.closest('[data-main-tab]');if(mt){state.settings.activeTab=mt.dataset.mainTab;state.settings.selectedArea=['home','daily','inbox'].includes(mt.dataset.mainTab)?'':mt.dataset.mainTab;state.settings.subtab='overview';renderAll();return}
  const st=e.target.closest('[data-subtab]');if(st){state.settings.subtab=st.dataset.subtab;renderArea(state.settings.selectedArea||state.settings.activeTab);save();return}
  const oa=e.target.closest('[data-open-area]');if(oa){const a=areaById(oa.dataset.openArea);if(a){state.settings.activeTab=getTopDomain(a)?.id||a.id;state.settings.selectedArea=a.id;state.settings.subtab='overview';renderTabs();renderArea(a.id);save()}return}
  const pc=e.target.closest('[data-project]');if(pc){openProject(pc.dataset.project);return}
  const qa=e.target.closest('[data-quick-add]');if(qa){openCapture(qa.dataset.quickAdd,qa.dataset.area||'');return}
  const sk=e.target.closest('[data-search-kind]');if(sk){closeOverlay('searchOverlay');if(sk.dataset.searchKind==='PROJECT')openProject(sk.dataset.searchId);else if(sk.dataset.searchKind==='AREA'){const a=areaById(sk.dataset.searchId);if(a){state.settings.activeTab=getTopDomain(a)?.id||a.id;state.settings.selectedArea=a.id;state.settings.subtab='overview';renderTabs();renderArea(a.id);save()}}else if(sk.dataset.searchArea){const a=areaById(sk.dataset.searchArea);if(a){state.settings.activeTab=getTopDomain(a)?.id||a.id;state.settings.selectedArea=a.id;state.settings.subtab='notes';renderTabs();renderArea(a.id);save()}}return}
  const et=e.target.closest('[data-editor-tab]');if(et){state.settings.editorTab=et.dataset.editorTab;renderEditor();save();return}
  const act=e.target.closest('[data-ed-action]');if(act)handleEditorAction(act)
});
document.getElementById('homeBtn').addEventListener('click',()=>{state.settings.activeTab='home';state.settings.selectedArea='';state.settings.subtab='overview';renderAll()});document.getElementById('captureBtn').addEventListener('click',()=>openCapture());document.getElementById('searchBtn').addEventListener('click',()=>{openOverlay('searchOverlay');renderSearch();setTimeout(()=>document.getElementById('searchInput').focus(),80)});document.getElementById('editBtn').addEventListener('click',openEditor);document.getElementById('themeBtn').addEventListener('click',()=>{state.settings.theme=state.settings.theme==='night'?'day':'night';applyTheme();save()});document.getElementById('lockBtn').addEventListener('click',()=>lockAtlas('manual'));document.getElementById('saveCapture').addEventListener('click',saveCapture);document.getElementById('searchInput').addEventListener('input',renderSearch);document.getElementById('exportBtn').addEventListener('click',exportData);
document.getElementById('sectionSelect').addEventListener('change',e=>{const tab=e.target.value;if(!tab){state.settings.activeTab='home';state.settings.selectedArea='';state.settings.subtab='overview';renderAll();return}state.settings.activeTab=tab;state.settings.selectedArea=['daily','inbox'].includes(tab)?'':tab;state.settings.subtab='overview';renderAll()});
document.getElementById('spaceFilter').addEventListener('change',e=>{state.settings.spaceFilter=e.target.value;renderAll()});
document.getElementById('projectBody').addEventListener('change',e=>{const p=projectById(activeProjectId);if(!p)return;if(e.target.dataset.projectTask){const t=p.tasks.find(x=>x.id===e.target.dataset.projectTask);if(t)t.done=e.target.checked}if(e.target.dataset.projectMilestone){const m=p.milestones.find(x=>x.id===e.target.dataset.projectMilestone);if(m)m.done=e.target.checked}log(`Project progress updated: ${p.title}.`);save();openProject(p.id);renderAll()});
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{await idbBackup(state,'before JSON import');state=ensureState(JSON.parse(r.result));log('Atlas data imported.');await save();renderAll();toast('Atlas data imported')}catch(err){alert('That file could not be imported.')}};r.readAsText(f);e.target.value=''})

document.getElementById('editorPane').addEventListener('change',e=>{
  let t=e.target;
  if(t.dataset.areaEdit!==undefined){let a=state.areas[Number(t.dataset.areaEdit)];if(a){a[t.dataset.field]=t.dataset.field==='level'?Number(t.value):t.value;if(t.dataset.field==='name')a.code=makeNodeCode(a.name);if(t.dataset.field==='level'||t.dataset.field==='parentId')organiseHierarchyLayout(state);save();renderAll()}return}
  if(t.dataset.projEdit!==undefined){let p=state.projects[Number(t.dataset.projEdit)];if(p){p[t.dataset.field]=t.value;const ar=areaById(p.areaId);if(ar)p.space=ar.space;save();renderAll()}return}
  if(t.dataset.noteEdit!==undefined){let n=state.notes[Number(t.dataset.noteEdit)];if(n){n[t.dataset.field]=t.value;const ar=areaById(n.areaId);if(ar)n.space=ar.space;save();renderAll()}return}
  if(t.dataset.linkEdit!==undefined){let l=state.links[Number(t.dataset.linkEdit)];if(l){l[t.dataset.field]=t.value;save();renderAll()}return}
});
async function handleEditorAction(b){const a=b.dataset.edAction;
  if(a==='add-area'){const parent=state.areas.find(x=>x.level===2)||state.areas[0];state.areas.push({id:uid('area'),name:'New Area',code:'NEW',space:parent?.space||'personal',level:3,parentId:parent?.id||'atlas',description:'',x:600,y:430,status:'default'});organiseHierarchyLayout(state);log('New Atlas area created.');save();renderEditor();renderAll()}
  if(a==='remove-area'){const i=Number(b.dataset.index),x=state.areas[i];if(x&&confirm(`Remove ${x.name}? Linked notes/projects will become unlinked.`)){state.projects.forEach(p=>{if(p.areaId===x.id)p.areaId='';if(p.topicId===x.id)p.topicId=''});state.notes.forEach(n=>{if(n.areaId===x.id)n.areaId='';if(n.topicId===x.id)n.topicId=''});state.areas.forEach(c=>{if(c.parentId===x.id)c.parentId='atlas'});state.links=state.links.filter(l=>l.source!==x.id&&l.target!==x.id);state.areas.splice(i,1);save();renderEditor();renderAll()}}
  if(a==='edit-area'){openAreaEditor(Number(b.dataset.index))}
  if(a==='back-structure'){state.settings.editorTab='structure';renderEditor()}
  if(a==='save-area-detail'){const i=Number(b.dataset.index),x=state.areas[i];if(x){x.name=document.getElementById('eaName').value.trim()||x.name;x.code=makeNodeCode(x.name);x.space=document.getElementById('eaSpace').value;x.level=Number(document.getElementById('eaLevel').value);x.parentId=document.getElementById('eaParent').value;x.description=document.getElementById('eaDescription').value.trim();organiseHierarchyLayout(state);log(`Area edited: ${x.name}.`);save();openAreaEditor(i);renderAll();toast('Area saved')}}
  if(a==='add-project'){state.projects.unshift({id:uid('p'),space:'personal',areaId:state.areas[0]?.id||'',topicId:'',code:`P-${String(state.projects.length+1).padStart(2,'0')}`,title:'New Project',status:'ACTIVE',objective:'',next:'',tags:[],createdAt:now(),milestones:[],tasks:[]});save();renderEditor();renderAll()}
  if(a==='remove-project'){state.projects.splice(Number(b.dataset.index),1);save();renderEditor();renderAll()}
  if(a==='edit-project'){openProjectEditor(Number(b.dataset.index))}
  if(a==='back-projects'){state.settings.editorTab='projects';renderEditor()}
  if(a==='add-note'){openCapture('note');closeOverlay('editorOverlay')}
  if(a==='remove-note'){state.notes.splice(Number(b.dataset.index),1);save();renderEditor();renderAll()}
  if(a==='edit-note'){openNoteEditor(Number(b.dataset.index))}
  if(a==='back-notes'){state.settings.editorTab='notes';renderEditor()}
  if(a==='save-note-detail'){const i=Number(b.dataset.index),n=state.notes[i];if(n){n.title=document.getElementById('enTitle').value.trim()||n.title;n.type=document.getElementById('enType').value.trim()||'note';n.areaId=document.getElementById('enArea').value;n.topicId=document.getElementById('enTopic').value;n.body=document.getElementById('enBody').value;n.tags=document.getElementById('enTags').value.split(',').map(s=>s.trim()).filter(Boolean);n.showOnMap=document.getElementById('enMap').value==='true';const ar=areaById(n.topicId)||areaById(n.areaId);if(ar)n.space=ar.space;log(`Note edited: ${n.title}.`);save();openNoteEditor(i);renderAll();toast('Note saved')}}
  if(a==='add-link'){if(state.areas.length>1)state.links.push({id:uid('link'),source:state.areas[0].id,target:state.areas[1].id,type:'cross'});save();renderEditor();renderAll()}
  if(a==='remove-link'){state.links.splice(Number(b.dataset.index),1);save();renderEditor();renderAll()}
  if(a==='enable-lock'){closeOverlay('editorOverlay');showSetupScreen();return}
  if(a==='save-security'){authConfig.idleMinutes=Number(document.getElementById('secIdle')?.value||15);authConfig.updatedAt=Date.now();await authSet(authConfig);resetIdleTimer();securityMsg('Auto-lock setting saved.');toast('Security setting saved')}
  if(a==='change-password'){if(!(await verifyCurrentSecurityPassword())){securityMsg('Current password is incorrect.');return}const np=document.getElementById('secNew').value,nc=document.getElementById('secConfirm').value;if(np.length<8){securityMsg('New password must be at least 8 characters.');return}if(np!==nc){securityMsg('New passwords do not match.');return}authConfig.password=await makeVerifier(np,210000);authConfig.updatedAt=Date.now();await authSet(authConfig);recoveryAuthenticated=false;securityMsg('Password changed.');toast('Password changed')}
  if(a==='new-recovery'){if(!(await verifyCurrentSecurityPassword())){securityMsg('Current password is required.');return}const key=generateRecoveryKey();authConfig.recovery=await makeVerifier(key,160000);authConfig.updatedAt=Date.now();await authSet(authConfig);securityMsg(`New recovery key: ${key} — save it now; it will not be shown again.`)}
  if(a==='disable-lock'){if(!(await verifyCurrentSecurityPassword())){securityMsg('Current password is required.');return}if(confirm('Disable Atlas Lock on this device?')){authConfig={enabled:false,updatedAt:Date.now()};recoveryAuthenticated=false;await authSet(authConfig);sessionStorage.removeItem('atlas_session_unlocked');securityMsg('Atlas Lock disabled on this device.');toast('Atlas Lock disabled')}}
  if(a==='snapshot'){await idbBackup(state,'manual snapshot');toast('Snapshot created')}
  if(a==='restore-latest'){const backups=await idbBackups();const latest=backups[0];if(!latest){toast('No snapshots yet');return}if(confirm(`Restore snapshot from ${fmtDate(latest.createdAt)} ${fmtTime(latest.createdAt)}? Current data will be snapshotted first.`)){await idbBackup(state,'before snapshot restore');state=ensureState(clone(latest.data));log(`Snapshot restored from ${fmtDate(latest.createdAt)}.`);await save();renderEditor();renderAll();toast('Snapshot restored')}}
  if(a==='export')exportData();
  if(a==='reset'){if(confirm('Reset Atlas to the demo structure? This replaces the data currently stored in this browser.')){await idbBackup(state,'before demo reset');state=clone(demo);await save();renderEditor();renderAll();toast('Atlas reset')}}
  if(['add-milestone','remove-milestone','add-task','remove-task','save-project-detail'].includes(a)){const i=Number(b.dataset.index),p=state.projects[i];if(!p)return;if(a==='add-milestone'){p.milestones.push({id:uid('m'),title:'New milestone',done:false})}if(a==='remove-milestone'){p.milestones.splice(Number(b.dataset.subindex),1)}if(a==='add-task'){p.tasks.push({id:uid('t'),title:'New task',done:false})}if(a==='remove-task'){p.tasks.splice(Number(b.dataset.subindex),1)}if(a==='save-project-detail'){p.title=document.getElementById('epTitle').value.trim()||p.title;p.status=document.getElementById('epStatus').value;p.objective=document.getElementById('epObjective').value.trim();p.next=document.getElementById('epNext').value.trim();p.tags=document.getElementById('epTags').value.split(',').map(s=>s.trim()).filter(Boolean);document.querySelectorAll('[data-ep-milestone]').forEach(x=>{if(p.milestones[Number(x.dataset.epMilestone)])p.milestones[Number(x.dataset.epMilestone)].done=x.checked});document.querySelectorAll('[data-ep-milestone-title]').forEach(x=>{if(p.milestones[Number(x.dataset.epMilestoneTitle)])p.milestones[Number(x.dataset.epMilestoneTitle)].title=x.value});document.querySelectorAll('[data-ep-task]').forEach(x=>{if(p.tasks[Number(x.dataset.epTask)])p.tasks[Number(x.dataset.epTask)].done=x.checked});document.querySelectorAll('[data-ep-task-title]').forEach(x=>{if(p.tasks[Number(x.dataset.epTaskTitle)])p.tasks[Number(x.dataset.epTaskTitle)].title=x.value});log(`Project edited: ${p.title}.`);toast('Project saved')}save();openProjectEditor(i);renderAll()}
}

load();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
